[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn"
version = "0.1.0"
description = "Reproducible churn training and batch prediction"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "matplotlib", "scikit-learn"]

[project.scripts]
telco-churn = "telco_churn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
